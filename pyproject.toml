[project]
name = "zero-bed-by-midnight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bartugenccan", email = "bartugenccandev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.2.2",
]

[project.scripts]
zero-bed-by-midnight = "zero_bed_by_midnight:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
